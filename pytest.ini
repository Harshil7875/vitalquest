[pytest]
asyncio_mode = auto
testpaths =
    health_service/tests
    game_service/tests
    notification_worker/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers
markers =
    integration: requires real Redis or Postgres (testcontainers)
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:jose.*
