worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Rate limiting: health/sync is a high-value endpoint — cap burst abuse
    limit_req_zone $binary_remote_addr zone=health_sync:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=20r/m;

    upstream health_service {
        server health_service:8000;
    }

    upstream game_service {
        server game_service:8001;
    }

    server {
        listen 80;
        server_name _;

        # ─── Webhook routes (cloud-to-cloud device integrations) ─────────────
        # Higher rate limit — these come from provider servers, not end users
        location /api/health/webhooks/ {
            limit_req zone=health_sync burst=50 nodelay;
            proxy_pass http://health_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/health/oauth/ {
            proxy_pass http://health_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Health & Auth routes → health_service ────────────────────────────
        location /api/auth/ {
            limit_req zone=auth burst=5 nodelay;
            proxy_pass http://health_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/health/ {
            limit_req zone=health_sync burst=3 nodelay;
            proxy_pass http://health_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /api/clinical/ {
            proxy_pass http://health_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Game routes → game_service ───────────────────────────────────────
        location /api/game/ {
            proxy_pass http://game_service;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # ─── Catch-all: reject anything that doesn't match known prefixes ──────
        location / {
            return 404;
        }
    }
}
