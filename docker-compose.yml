version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - health_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - game_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  health_service:
    build:
      context: ./health_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_DSN: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DAILY_MANA_CAP: ${DAILY_MANA_CAP:-500}
      GUILD_CRON_HOUR: ${GUILD_CRON_HOUR:-23}
      GUILD_CRON_MINUTE: ${GUILD_CRON_MINUTE:-59}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - health_net
      - game_net  # health_service bridges both networks to publish reward events
    expose:
      - "8000"

  game_service:
    build:
      context: ./game_service
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      # Explicitly NO POSTGRES_DSN — game service cannot access PHI database
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - game_net
    expose:
      - "8001"

  nginx:
    image: nginx:1.25-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - health_service
      - game_service
    networks:
      - health_net
      - game_net

volumes:
  postgres_data:
  redis_data:

networks:
  health_net:
    driver: bridge
  game_net:
    driver: bridge
